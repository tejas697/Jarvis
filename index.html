<!DOCTYPE html>
<html>
<head>
  <title>JARVIS</title>
</head>

<body>
  <h1>JARVIS</h1>
  <p>Online. Ready for commands.</p>

  <button onclick="speak()">Activate JARVIS</button>
  
  <button onclick="listen()">Talk to JARVIS 🎙️</button>
<p id="result">Waiting for your voice...</p>

  <script>
    function speak() {
    const voice = new SpeechSynthesisUtterance(
        "Hello, I am Jarvis. How can I help you?"
    );

    voice.pitch = 0.7;
    voice.rate = 0.9;
    voice.volume = 1;

    speechSynthesis.cancel();
    speechSynthesis.speak(voice);
    }
    function listen() {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    const result = document.getElementById("result");

    if (!SpeechRecognition) {
        result.textContent = "Voice recognition is not supported.";
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.interimResults = false;

    recognition.onresult = function(event) {
        const words = event.results[0][0].transcript;
        result.textContent = "You said: " + words;
    };

    recognition.onerror = function() {
        result.textContent = "Sorry, I couldn't hear you.";
    };

    recognition.start();
    }
  </script>
</body>
</html>
